<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Maquininha de Cartão</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body { background: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

#app {
width: 320px; height: 500px; background: #333; border-radius: 20px;
padding: 20px; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
position: relative; /* Necessário para o botão absoluto funcionar */
}

.screen { flex: 1; display: none; flex-direction: column; justify-content: center; align-items: center; border-radius: 10px; padding: 20px; text-align: center; }
.active { display: flex; }

/* Botão Reiniciar */
.btn-reset {
position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.2);
color: white; border: none; padding: 5px 10px; font-size: 12px;
border-radius: 5px; cursor: pointer;
}

/* Estilo Tela Inicial */
#home { background: #fff; }
button.btn-opt { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #007bff; color: white; }

/* Estilo Erro */
.error-screen { background: #ff4d4d; color: white; }
.icon-x { font-size: 50px; margin-bottom: 20px; }

/* Estilo Sucesso */
.success-screen { background: #fff; color: #333; }
.spinner { border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }

@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="app">
<div id="home" class="screen active">
<h2>Selecione a forma:</h2>
<button class="btn-opt" onclick="showScreen('error')">Débito</button>
<button class="btn-opt" onclick="showScreen('error')">Crédito</button>
<button class="btn-opt" onclick="showScreen('outro')">Beijo</button>
</div>

<div id="error" class="screen error-screen">
<button class="btn-reset" onclick="showScreen('home')">Reiniciar</button>
<div class="icon-x">✖</div>
<p>Erro - opção não disponível no momento</p>
</div>

<div id="outro" class="screen success-screen">
<button class="btn-reset" onclick="showScreen('home')">Reiniciar</button>
<div class="spinner"></div>
<p>Opção escolhida: Beijo<br>Prossiga com o pagamento</p>
</div>
</div>

<script>
function showScreen(id) {
document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}
</script>
</body>
</html>
